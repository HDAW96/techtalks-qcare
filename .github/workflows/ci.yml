name: CI

# Runs on every pull request, and on main after a merge, so a branch that
# does not build is caught before anyone reviews it rather than after.
on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch cancels the run still going for the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ci, not install: it installs exactly what package-lock.json pins and
      # fails if the two have drifted apart.
      - run: npm ci

      - run: npm run lint

      - run: npm run build

  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      # mvnw is committed without the executable bit (it was added from
      # Windows), so Linux refuses to run it until we set it here.
      - run: chmod +x mvnw

      # The tests use an in-memory H2 database, so no MySQL service and no
      # QCARE_DB_PASSWORD are needed. --batch-mode keeps the log readable.
      - run: ./mvnw --batch-mode test
