spring.application.name=qcare

# Server Port
server.port=8080

# MySQL Database Connection Settings
# connectionTimeZone=SERVER with preserveInstants=false stores an appointment
# time exactly as it was chosen. With serverTimezone=UTC the driver shifted
# every LocalDateTime by the clinic's offset, so 09:30 was written to MySQL
# as 06:30 - it read back correctly, but anyone querying the database saw
# the wrong time.
spring.datasource.url=jdbc:mysql://localhost:3306/qcare_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=SERVER&preserveInstants=false
spring.datasource.username=${QCARE_DB_USER:root}
# Read from the QCARE_DB_PASSWORD environment variable - never commit a password.
# Set it once per machine, e.g. on Windows:
#   [Environment]::SetEnvironmentVariable('QCARE_DB_PASSWORD','your-password','User')
spring.datasource.password=${QCARE_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Authentication
# The signing key for login tokens. Must be at least 32 characters.
# Set QCARE_JWT_SECRET on any machine that is not a developer laptop.
qcare.jwt.secret=${QCARE_JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
qcare.jwt.expiry-hours=12
