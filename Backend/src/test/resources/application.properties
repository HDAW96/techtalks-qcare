# Tests run against an in-memory database, thrown away afterwards. Nothing
# here touches the MySQL a developer has on their machine, so the tests need
# neither the server running nor QCARE_DB_PASSWORD set.
spring.datasource.url=jdbc:h2:mem:qcare;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# A fixed key, so a test does not depend on the machine it runs on. It signs
# nothing outside the test run.
qcare.jwt.secret=test-only-secret-not-used-anywhere-0123456789
qcare.jwt.expiry-hours=1
qcare.qr.secret=test-only-qr-secret-0123456789
# The seeded staff accounts' password. Set here rather than left to the
# environment, so a QCARE_SEED_PASSWORD on the machine cannot change what the
# tests sign in with.
qcare.seed.password=changeme123
qcare.frontend-url=http://localhost:5173
qcare.cors.allowed-origins=http://localhost:5173
